<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CausalBot</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        background: #080810;
        overflow: hidden;
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      /* Three.js canvas fills the whole viewport */
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      /*
       * All HUD elements are created programmatically by:
       *   src/ui/dashboard.js  — top-right panel
       *   src/ui/controls.js   — bottom-centre instruction bar
       *
       * This file intentionally contains no UI chrome beyond the canvas.
       * That keeps HTML as a dumb shell and the UI logic version-controlled
       * alongside the JS that drives it.
       */

      /* Minimal loading overlay (shown before boot() completes) */
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #080810;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: opacity 0.6s ease;
      }
      #boot-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-overlay .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #4fc3f7;
        text-transform: uppercase;
      }
      #boot-overlay .sub {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #4a5568;
      }
      #boot-overlay .spinner {
        width: 28px; height: 28px;
        border: 2px solid rgba(79, 195, 247, 0.15);
        border-top-color: #4fc3f7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Boot splash — hidden by main.js once the engine starts -->
    <div id="boot-overlay">
      <div class="logo">CausalBot</div>
      <div class="sub">Universal Robot Adapter</div>
      <div class="spinner"></div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
