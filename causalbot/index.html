<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CausalBot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a0a; overflow: hidden; font-family: monospace; }
      canvas { display: block; }

      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #status-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 6px 18px;
        color: #aaa;
        font-size: 12px;
        letter-spacing: 0.05em;
      }

      #memory-log {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .memory-item {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        border-left: 2px solid #333;
        background: rgba(0,0,0,0.5);
        color: #666;
      }
      .memory-item.success { border-color: #1D9E75; color: #1D9E75; }
      .memory-item.fail    { border-color: #E24B4A; color: #E24B4A; }

      #skill-log {
        position: absolute;
        top: 16px;
        right: 284px;
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .skill-item {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(0,0,0,0.5);
        border-left: 2px solid #534AB7;
        color: #AFA9EC;
      }
      .skill-item.new { border-color: #EF9F27; color: #FAC775; }

      #input-wrap {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: all;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #instruction {
        width: 400px;
        padding: 10px 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 24px;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      #instruction::placeholder { color: #444; }
      #instruction:focus { border-color: rgba(255,255,255,0.4); }
      #instruction:disabled { opacity: 0.4; }
      
      #agent-status {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 11px;
        color: #fff;
        background: rgba(0,0,0,0.7);
        border: 1px solid rgba(255,255,255,0.1);
        display: none;
        align-items: center;
        gap: 6px;
        transition: all 0.3s;
        z-index: 100;
        backdrop-filter: blur(4px);
      }
      
      #agent-status.visible { display: flex; }
      #agent-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
      
      /* State types */
      #agent-status.thinking { border-color: #FAC775; color: #FAC775; }
      #agent-status.thinking .dot { background: #FAC775; box-shadow: 0 0 5px #FAC775; animation: pulse 1s infinite; }
      
      #agent-status.navigating { border-color: #4488ff; color: #4488ff; }
      #agent-status.navigating .dot { background: #4488ff; box-shadow: 0 0 5px #4488ff; }
      
      #agent-status.scanning { border-color: #c084fc; color: #c084fc; }
      #agent-status.scanning .dot { background: #c084fc; box-shadow: 0 0 5px #c084fc; animation: rotate 2s linear infinite; }
      
      #agent-status.error { border-color: #E24B4A; color: #E24B4A; }
      #agent-status.error .dot { background: #E24B4A; }

      #agent-status.success { border-color: #1D9E75; color: #1D9E75; }
      #agent-status.success .dot { background: #1D9E75; }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #approve-panel {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        border: 1px solid rgba(255,200,100,0.3);
        border-radius: 12px;
        padding: 14px 20px;
        display: none;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        pointer-events: all;
        min-width: 300px;
      }

      #approve-panel.visible { display: flex; }

      #approve-title {
        font-size: 12px;
        color: #FAC775;
        letter-spacing: 0.05em;
      }

      #approve-skill-name {
        font-size: 14px;
        font-weight: bold;
        color: #fff;
      }

      #approve-btns {
        display: flex;
        gap: 10px;
      }

      .approve-btn {
        padding: 6px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.2);
        background: transparent;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
        pointer-events: all;
        transition: background 0.15s;
      }
      .approve-btn:hover { background: rgba(255,255,255,0.1); }
      .approve-btn.yes { border-color: #1D9E75; color: #1D9E75; }
      .approve-btn.yes:hover { background: rgba(29,158,117,0.15); }
      .approve-btn.no  { border-color: #E24B4A; color: #E24B4A; }
      .approve-btn.no:hover  { background: rgba(226,75,74,0.15); }

      #tooltip {
        position: absolute;
        background: rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 11px;
        color: #ccc;
        pointer-events: none;
        display: none;
        max-width: 200px;
      }

      #thought-sidebar {
        position: absolute;
        top: 80px;
        left: 16px;
        width: 260px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        z-index: 100;
        opacity: 0;
        transition: opacity 0.4s;
      }

      #thought-sidebar.visible {
        opacity: 1;
      }

      .thought-header {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #FAC775;
        margin-bottom: 2px;
        padding-left: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .thought-header::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #FAC775;
        box-shadow: 0 0 6px #FAC775;
        animation: pulse-dot 1.5s ease-in-out infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.7); }
      }

      .thought-step {
        font-size: 11px;
        padding: 8px 12px 8px 14px;
        background: rgba(10, 10, 18, 0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-left: 2px solid transparent;
        border-radius: 8px;
        color: #888;
        line-height: 1.5;
        transform: translateX(-14px);
        opacity: 0;
        transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .thought-step.active {
        transform: translateX(0);
        opacity: 1;
        color: #ccc;
        border-left-color: #FAC775;
      }

      /* reasoning = first step, slightly brighter */
      .thought-step:first-child.active {
        color: #e0e0e0;
        border-left-color: #c084fc;
        background: rgba(192, 132, 252, 0.08);
      }

      /* goal = last step, green tint */
      .thought-step:last-child.active {
        border-left-color: #1D9E75;
        color: #5eead4;
        background: rgba(29, 158, 117, 0.07);
      }

      /* ─── RL Dashboard ───────────────────────────────────────────────────── */
      #rl-dashboard {
        position: absolute;
        top: 60px;
        right: 16px;
        width: 248px;
        background: rgba(8, 8, 16, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: all;
        z-index: 200;
        user-select: none;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      }

      .rld-header { display: flex; flex-direction: column; gap: 4px; }
      .rld-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .rld-icon  { font-size: 14px; }
      .rld-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e2e8f0;
        flex: 1;
      }
      .rld-conn-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 2px 8px;
        border-radius: 20px;
        border: 1px solid #4b5563;
        color: #6b7280;
        background: rgba(255,255,255,0.03);
        transition: all 0.3s;
      }
      .rld-conn-online {
        border-color: #4ade80 !important;
        color: #4ade80 !important;
        background: rgba(74, 222, 128, 0.08) !important;
        box-shadow: 0 0 8px rgba(74,222,128,0.2);
      }
      .rld-mode-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
      }
      .rld-mode-label {
        font-size: 10px;
        letter-spacing: 0.1em;
        color: #4b5563;
      }
      .rld-mode-val {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #888;
        transition: color 0.3s;
      }

      .rld-section {
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .rld-section-title {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 2px;
      }
      .rld-kv-row {
        display: flex;
        align-items: baseline;
        gap: 4px;
        flex-wrap: wrap;
      }
      .rld-key {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #6b7280;
        text-transform: uppercase;
      }
      .rld-val {
        font-size: 11px;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        color: #e2e8f0;
        min-width: 38px;
        transition: color 0.2s;
      }

      /* Goal inputs */
      .rld-goal-inputs {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-top: 2px;
      }
      .rld-coord-input {
        width: 60px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 11px;
        font-family: monospace;
        padding: 4px 6px;
        outline: none;
        transition: border-color 0.2s;
      }
      .rld-coord-input:focus { border-color: #38bdf8; }

      /* Action bars */
      .rld-action-bars { display: flex; flex-direction: column; gap: 4px; }
      .rld-bar-wrap    { display: flex; align-items: center; gap: 6px; }
      .rld-bar-label   { font-size: 10px; color: #6b7280; width: 20px; text-align: right; }
      .rld-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(255,255,255,0.07);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }
      .rld-bar-center::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 0; bottom: 0;
        width: 1px;
        background: rgba(255,255,255,0.15);
      }
      .rld-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.08s, left 0.08s;
        position: absolute;
        left: 0;
      }
      .rld-bar-linear  { background: #4ade80; }
      .rld-bar-angular { background: #f59e0b; }

      /* Lidar canvas */
      #rld-lidar-canvas {
        width: 100%;
        height: 80px;
        border-radius: 6px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
      }

      /* Step progress bar */
      .rld-step-bar-wrap  { margin-top: 4px; }
      .rld-step-bar-track {
        height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .rld-step-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.15s, background 0.3s;
      }

      /* Param row */
      .rld-param-row   { display: flex; align-items: center; gap: 6px; }
      .rld-param-label { font-size: 10px; color: #6b7280; width: 64px; }
      .rld-param-input {
        flex: 1;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 11px;
        font-family: monospace;
        padding: 4px 6px;
        outline: none;
        transition: border-color 0.2s;
      }
      .rld-param-input:focus { border-color: #a78bfa; }

      .rld-btn {
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: #cbd5e1;
        font-family: monospace;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        white-space: nowrap;
      }
      .rld-btn:hover  { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
      .rld-btn-rl     { border-color: #a78bfa; color: #a78bfa; }
      .rld-btn-rl:hover { background: rgba(167,139,250,0.15); }
      .rld-btn-sm     { font-size: 10px; padding: 4px 8px; }
      .rld-btn-apply  {
        width: 100%;
        margin-top: 6px;
        border-color: rgba(167,139,250,0.4);
        color: #a78bfa;
      }
      .rld-btn-apply:hover { background: rgba(167,139,250,0.12); }
      .rld-btn-train  { background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.4); }

      .rld-btn-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .rld-controls { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }

      /* Win-rate bar */
      .rld-win-bar-wrap  { margin-top: 3px; }
      .rld-win-bar-track {
        height: 5px;
        background: rgba(255,255,255,0.06);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }
      .rld-win-bar-fill {
        height: 100%;
        border-radius: 3px;
        width: 0;
        transition: width 0.4s ease, background 0.4s ease;
      }

      /* History sparkline */
      #rld-history-canvas {
        width: 100%;
        height: 28px;
        border-radius: 4px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.04);
        display: block;
      }

      /* Scrollable panel */
      #rl-dashboard {
        max-height: calc(100vh - 80px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.1) transparent;
      }
      #rl-dashboard::-webkit-scrollbar { width: 4px; }
      #rl-dashboard::-webkit-scrollbar-track { background: transparent; }
      #rl-dashboard::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

      /* Body flex column (matches outer panel gap) */
      #rld-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Mode tabs */
      .rld-mode-tabs {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .rld-tab {
        flex: 1;
        padding: 5px 0;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.03);
        color: #6b7280;
        font-family: monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: all 0.15s;
      }
      .rld-tab:hover { background: rgba(255,255,255,0.08); color: #cbd5e1; }
      .rld-tab.rld-tab-active {
        background: rgba(167,139,250,0.18);
        border-color: rgba(167,139,250,0.5);
        color: #c4b5fd;
      }

      /* Navigation grid */
      .rld-nav-grid {
        display: grid;
        grid-template-columns: 44px 12px 1fr 12px 1fr;
        align-items: baseline;
        gap: 3px;
        font-size: 11px;
      }
      .rld-dist-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 2px;
      }
      .rld-val-dist {
        font-size: 13px;
        font-weight: 600;
      }

      /* Goal setter (visually separated from read-only display) */
      .rld-divider {
        height: 1px;
        background: rgba(255,255,255,0.07);
        margin: 4px 0;
      }
      .rld-set-goal-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .rld-set-goal-label {
        font-size: 9px;
        letter-spacing: 0.1em;
        color: #4b5563;
        text-transform: uppercase;
        width: 28px;
        flex-shrink: 0;
      }

      /* History legend */
      .rld-history-legend {
        font-size: 9px;
        color: rgba(255,255,255,0.3);
        margin-top: 3px;
        letter-spacing: 0.04em;
      }

    </style>
  </head>
  <body>
    <div id="ui">
      <div id="perception-mode-indicator" onclick="window.__togglePerception()" style="
        position: absolute;
        top: 16px;
        right: 284px;
        padding: 5px 14px;
        border-radius: 20px;
        border: 1px solid #4488ff;
        color: #4488ff;
        font-size: 11px;
        font-family: monospace;
        cursor: pointer;
        pointer-events: all;
        background: rgba(0,0,0,0.5);
        transition: all 0.2s;
      ">🧠 Omniscient</div>
      <div id="status-bar">Ready</div>
      <div id="memory-log"></div>
      <div id="skill-log"></div>

      <!-- RL Dashboard -->
      <div id="rl-dashboard"></div>

      <div id="approve-panel">
        <div id="approve-title">New skill invented</div>
        <div id="approve-skill-name"></div>
        <div id="approve-btns">
          <button class="approve-btn yes" id="btn-approve">Save permanently</button>
          <button class="approve-btn no"  id="btn-reject">Discard</button>
        </div>
      </div>

      <div id="input-wrap">
        <div id="agent-status">
          <div class="dot"></div>
          <span id="agent-status-text"></span>
        </div>
        <input id="instruction" type="text" placeholder="tell the robot what to do..." />
      </div>

      <div id="tooltip"></div>
      <div id="thought-sidebar">
        <div class="thought-header">Chain of Thought</div>
        <div id="thought-list"></div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
